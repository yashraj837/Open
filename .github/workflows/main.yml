name: SSH Session with OpenCode

on:
  workflow_dispatch:

jobs:
  ssh-session:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install OpenCode
        run: curl -fsSL https://opencode.ai/install | bash || true

      - name: Setup SSH + sshx
        run: |
          set +e

          # Setup SSH
          echo "runner:1234" | sudo chpasswd
          echo "Port 2222" | sudo tee -a /etc/ssh/sshd_config
          echo "PasswordAuthentication yes" | sudo tee -a /etc/ssh/sshd_config
          echo "ChallengeResponseAuthentication yes" | sudo tee -a /etc/ssh/sshd_config
          echo "UsePAM yes" | sudo tee -a /etc/ssh/sshd_config
          sudo systemctl restart ssh
          sleep 2

          # Install sshx
          curl -sSf https://sshx.io/get | sh

          # Start sshx — pipe both stdout and stderr to log AND terminal
          sshx 2>&1 | tee /tmp/sshx.log &
          sleep 8

          # Print whatever sshx output
          echo "=== SSHX OUTPUT ==="
          cat /tmp/sshx.log
          echo "==================="

          # Status every 2 minutes
          while true; do
            sleep 120
            echo "========================================"
            echo "  TIME : $(date)"
            echo "  SSHX URL:"
            cat /tmp/sshx.log
            echo ""
            echo "  Once inside sshx terminal run:"
            echo "  ssh -p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R0:localhost:2222 tcp@a.pinggy.io"
            echo "========================================"
          done &

          sleep 21300
