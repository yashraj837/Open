name: SSH Session with OpenCode

on:
  workflow_dispatch:

jobs:
  ssh-session:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: SSH Config
        run: |
          echo "runner:1234" | sudo chpasswd
          echo "Port 2222" | sudo tee -a /etc/ssh/sshd_config
          echo "PasswordAuthentication yes" | sudo tee -a /etc/ssh/sshd_config
          echo "ChallengeResponseAuthentication yes" | sudo tee -a /etc/ssh/sshd_config
          echo "UsePAM yes" | sudo tee -a /etc/ssh/sshd_config
          echo "PermitRootLogin yes" | sudo tee -a /etc/ssh/sshd_config
          sudo systemctl restart ssh
          sleep 2
          sudo ss -tlnp | grep 2222 || echo "SSH not on 2222 yet"
          sudo systemctl status ssh || true

      - name: Install OpenCode
        run: curl -fsSL https://opencode.ai/install | bash || true

      - name: Install Bore
        run: |
          curl -L https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz | tar xz
          sudo mv bore /usr/local/bin/
          bore --version

      - name: Start Tunnel and Keep Alive
        run: |
          set +e

          # SSH watchdog
          while true; do
            if ! sudo ss -tlnp | grep -q 2222; then
              echo "[$(date)] SSH died restarting..."
              sudo systemctl restart ssh
            fi
            sleep 30
          done &

          # Bore tunnel loop
          FIXED_PORT=55000
          RETRY=0
          while true; do
            bore local 2222 --to bore.pub --port $FIXED_PORT > /tmp/bore.log 2>&1 &
            BORE_PID=$!
            sleep 8
            PORT=$(grep -oP 'listening at bore.pub:\K[0-9]+' /tmp/bore.log || echo "")
            if [ -n "$PORT" ]; then
              RETRY=0
              echo "========================================"
              echo "  CMD  : ssh runner@bore.pub -p $PORT"
              echo "  PASS : 1234"
              echo "  ROOT : sudo -i"
              echo "  TIME : $(date)"
              echo "========================================"
              wait $BORE_PID
              echo "[$(date)] Bore dropped. Reconnecting..."
            else
              kill $BORE_PID 2>/dev/null
              RETRY=$((RETRY+1))
              if [ $RETRY -ge 3 ]; then
                FIXED_PORT=$((55000 + RANDOM % 1000))
                echo "[$(date)] Port busy switching to $FIXED_PORT"
                RETRY=0
              fi
            fi
            sleep 5
          done &

          # Status every 2 minutes
          while true; do
            sleep 2
            PORT=$(grep -oP 'listening at bore.pub:\K[0-9]+' /tmp/bore.log 2>/dev/null | tail -1)
            echo "========================================"
            echo "  TIME : $(date)"
            echo "  CMD  : ssh runner@bore.pub -p ${PORT:-55000}"
            echo "  PASS : 1234"
            echo "  ROOT : sudo -i"
            echo "========================================"
          done &

          sleep 21300
