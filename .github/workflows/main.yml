name: SSH Session with OpenCode

on:
  workflow_dispatch:

jobs:
  ssh-session:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install OpenCode
        run: curl -fsSL https://opencode.ai/install | bash || true

      - name: Setup SSH + sshx
        run: |
          set +e

          # Setup SSH
          echo "runner:1234" | sudo chpasswd
          echo "Port 2222" | sudo tee -a /etc/ssh/sshd_config
          echo "PasswordAuthentication yes" | sudo tee -a /etc/ssh/sshd_config
          echo "ChallengeResponseAuthentication yes" | sudo tee -a /etc/ssh/sshd_config
          echo "UsePAM yes" | sudo tee -a /etc/ssh/sshd_config
          sudo systemctl restart ssh
          sleep 2

          # Install sshx
          curl -sSf https://sshx.io/get | sh

          # Start sshx
          sshx > /tmp/sshx.log 2>&1 &
          sleep 5

          # Print URL every 2 min
          while true; do
            echo "========================================"
            echo "  TIME : $(date)"
            echo "  SSHX URL:"
            grep -oP 'https://sshx\.io/s#\S+' /tmp/sshx.log | tail -1
            echo ""
            echo "  Once inside sshx, run this for Termux:"
            echo "  ssh -p 443 -o StrictHostKeyChecking=no -R0:localhost:2222 tcp@a.pinggy.io"
            echo "  Then connect from Termux with the printed URL"
            echo "========================================"
            sleep 120
          done &

          sleep 21300
